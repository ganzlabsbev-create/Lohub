name: Convert app submissions

# รันอัตโนมัติทุกครั้งที่ merge PR ส่งแอปใหม่ (Part 10) เข้า main แล้วมีไฟล์ใน submissions/**
# หน้าที่: กำหนด app_id จริงแบบกันชนกัน, ย้าย icon/screenshots เข้า public/assets/, เขียน
# data/apps/{app_id}.json, ลบ submissions/{slug}/ ทิ้ง แล้ว "รัน build.js ต่อในจ็อบเดียวกันเลย"
# (แทนที่จะปล่อยให้ build-index.yml แยกจ็อบมา trigger เอง) เพราะการ commit ครั้งเดียวจบทั้ง
# convert + build ป้องกัน push สองรอบมาไล่ trigger กันเองไปมา (submissions/** ก็ถูกลบในคอมมิทนี้
# ซึ่งจะ trigger workflow นี้ซ้ำตัวเองได้ถ้าไม่ใช้ [skip ci], และ data/apps/** ที่เปลี่ยนก็จะไป
# trigger build-index.yml ซ้ำอีกรอบถ้าไม่กันไว้ — จึง build.js ในจ็อบนี้เลยแล้ว commit รวดเดียวพร้อม [skip ci])

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # กันสองรันพร้อมกัน (เช่น merge หลาย PR ไล่เลี่ยกัน) ไม่ให้ทั้งสองรันคำนวณ app_id ถัดไปจาก
  # data/apps/ ชุดเดิมพร้อมกันแล้วชนกัน — ให้คิวรอ ไม่ cancel รันที่กำลังทำงานอยู่
  group: convert-submissions-main
  cancel-in-progress: false

jobs:
  convert-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Convert submissions -> data/apps
        run: node scripts/builder/convert-submissions.js

      - name: Run builder
        run: node scripts/builder/build.js

      - name: Commit converted app(s) + rebuilt index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submissions data/apps public/assets data/manifest.json public/search-index.json
          if git diff --cached --quiet; then
            echo "ไม่มีอะไรเปลี่ยน ข้าม commit"
          else
            git commit -m "chore: convert app submissions + rebuild search-index [skip ci]"
            git push
          fi
